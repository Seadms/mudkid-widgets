<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Breathing</title>
<style>
  html, body { margin: 0; height: 100%; background: #F8F0E4; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
         font-family: "Segoe UI", system-ui, sans-serif; }
  #ring { width: min(46vw, 40vh); height: min(46vw, 40vh); border-radius: 50%;
          background: #D9EDF6; border: 4px solid #80C0DC; transition: transform 4s ease-in-out;
          display: flex; align-items: center; justify-content: center; }
  #core { width: 38%; height: 38%; border-radius: 50%; background: #80C0DC; border: 3px solid #223049; }
  #phase { color: #223049; font-weight: 700; font-size: clamp(17px, 5vh, 22px); min-height: 1.3em; }
  #hint { color: #223049; opacity: 0.55; font-size: 12px; }
</style>
</head>
<body>
<div id="ring"><div id="core"></div></div>
<div id="phase">breathe in</div>
<div id="hint">4 in, 4 hold, 4 out, 4 hold</div>
<script>
  var bg = new URLSearchParams(location.search).get('bg');
  if (bg === 'dark') bg = '#191919';
  else if (bg && bg !== 'transparent' && /^[0-9a-fA-F]{6}$/.test(bg)) bg = '#' + bg;
  if (bg) document.documentElement.style.background = document.body.style.background = bg;
  var ring = document.getElementById('ring'), phase = document.getElementById('phase');
  var steps = [
    { label: 'breathe in', scale: 1.25 },
    { label: 'hold', scale: 1.25 },
    { label: 'breathe out', scale: 1.0 },
    { label: 'hold', scale: 1.0 }
  ];
  var i = 0;
  function step() {
    phase.textContent = steps[i].label;
    ring.style.transform = 'scale(' + steps[i].scale + ')';
    i = (i + 1) % steps.length;
  }
  step();
  setInterval(step, 4000);
</script>
</body>
</html>
