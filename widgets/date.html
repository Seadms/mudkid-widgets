<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mudkid Date Card</title>
<style>
  html, body { margin: 0; height: 100%; background: #F8F0E4; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: "Segoe UI", system-ui, sans-serif; color: #223049; }
  #dow { font-size: clamp(20px, 12vh, 44px); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
  #rest { font-size: clamp(14px, 7vh, 24px); font-weight: 600; color: #223049; opacity: 0.75; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #F8A664; border: 2px solid #223049; margin-top: 8px; }
</style>
</head>
<body>
<div id="dow"></div>
<div id="rest"></div>
<div id="dot"></div>
<script>
  var bg = new URLSearchParams(location.search).get('bg');
  if (bg === 'dark') bg = '#191919';
  else if (bg && bg !== 'transparent' && /^[0-9a-fA-F]{6}$/.test(bg)) bg = '#' + bg;
  if (bg) document.documentElement.style.background = document.body.style.background = bg;
  function render() {
    var n = new Date();
    document.getElementById('dow').textContent = n.toLocaleDateString(undefined, { weekday: 'long' });
    document.getElementById('rest').textContent = n.toLocaleDateString(undefined, { month: 'long', day: 'numeric' });
  }
  render();
  setInterval(render, 60000);
</script>
</body>
</html>
