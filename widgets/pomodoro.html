<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mudkid Pomodoro</title>
<style>
  html, body { margin: 0; height: 100%; background: #F8F0E4; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
         font-family: "Segoe UI", system-ui, sans-serif; color: #223049; }
  #mode { font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; opacity: 0.65; }
  #time { font-size: clamp(34px, 14vh, 64px); font-weight: 800; letter-spacing: 2px; }
  #paws { display: flex; gap: 8px; }
  #paws svg { width: 26px; height: 26px; opacity: 0.25; }
  #paws svg.done { opacity: 1; }
  .row { display: flex; gap: 8px; }
  button { border: 2px solid #223049; background: #FDE4CE; color: #223049; font-weight: 700;
           border-radius: 999px; padding: 6px 16px; font-size: 14px; cursor: pointer; font-family: inherit; }
  button.primary { background: #F8A664; }
  button:active { transform: scale(0.95); }
</style>
</head>
<body>
<div id="mode">focus</div>
<div id="time">25:00</div>
<div id="paws"></div>
<div class="row">
  <button id="startpause" class="primary">Start</button>
  <button id="skip">Skip</button>
  <button id="reset">Reset</button>
</div>
<script>
  var bg = new URLSearchParams(location.search).get('bg');
  if (bg === 'dark') bg = '#191919';
  else if (bg && bg !== 'transparent' && /^[0-9a-fA-F]{6}$/.test(bg)) bg = '#' + bg;
  if (bg) document.documentElement.style.background = document.body.style.background = bg;

  var PAW = '<svg viewBox="0 0 24 24"><g fill="#F8A664" stroke="#223049" stroke-width="1.3">' +
    '<ellipse cx="7" cy="8" rx="2.2" ry="2.8"/><ellipse cx="12" cy="6.5" rx="2.2" ry="2.8"/>' +
    '<ellipse cx="17" cy="8" rx="2.2" ry="2.8"/><path d="M12 11c-3.6 0-6 2.6-6 5.2 0 2 1.6 3.3 3.4 2.9 1-.2 1.8-.4 2.6-.4s1.6.2 2.6.4c1.8.4 3.4-.9 3.4-2.9 0-2.6-2.4-5.2-6-5.2z"/></g></svg>';
  var pawsEl = document.getElementById('paws');
  pawsEl.innerHTML = PAW + PAW + PAW + PAW;

  var FOCUS = 25 * 60000, BREAK = 5 * 60000;
  var onBreak = false, leftMs = FOCUS, running = false, lastTick = 0, done = 0;
  var timeEl = document.getElementById('time'), modeEl = document.getElementById('mode'),
      sp = document.getElementById('startpause');

  function beep(freq) {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = freq; g.gain.setValueAtTime(0.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
      o.start(); o.stop(ctx.currentTime + 0.8);
    } catch (e) {}
  }
  function paint() {
    var m = Math.floor(leftMs / 60000), s = Math.floor(leftMs % 60000 / 1000);
    timeEl.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    modeEl.textContent = onBreak ? 'break' : 'focus';
    Array.prototype.forEach.call(pawsEl.children, function (p, i) {
      p.classList.toggle('done', i < done);
    });
  }
  function flip() {
    if (!onBreak) { done = Math.min(4, done + 1); beep(660); } else beep(520);
    onBreak = !onBreak;
    leftMs = onBreak ? BREAK : FOCUS;
    if (done >= 4 && !onBreak) { running = false; sp.textContent = 'Start'; done = 0; }
  }
  function loop(ts) {
    if (!running) return;
    if (lastTick) leftMs -= ts - lastTick;
    lastTick = ts;
    if (leftMs <= 0) flip();
    paint();
    if (running) requestAnimationFrame(loop);
  }
  sp.onclick = function () {
    running = !running; lastTick = 0;
    sp.textContent = running ? 'Pause' : 'Start';
    if (running) requestAnimationFrame(loop);
  };
  document.getElementById('skip').onclick = function () { flip(); paint(); };
  document.getElementById('reset').onclick = function () {
    running = false; onBreak = false; leftMs = FOCUS; done = 0; sp.textContent = 'Start'; paint();
  };
  paint();
</script>
</body>
</html>
